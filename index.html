<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRIPICK — Your Trip, Our Pick</title>
  <meta name="description" content="TRIPICK은 취향 퀴즈로 나에게 어울리는 여행지를 추천하고 여행 기록까지 도와주는 맞춤 여행 서비스입니다. 지금 나에게 맞는 여행을 찾아보세요.">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">

<body class="page-intro">
  <a class="skip-link" href="#main-content">본문 바로가기</a>
  <main class="intro" id="main-content" tabindex="-1">
    <img src="images/travel.png" alt="여행 이미지" class="intro-bg">
    <div class="intro-dim" aria-hidden="true"></div>

    <div class="intro-map-deco" aria-hidden="true">
      <img
        src="images/eurasia_map.png"
        alt=""
        class="intro-map"
        width="960"
        height="540"
        decoding="async"

    <header class="top">
      <div class="inner">
        <h1 class="title">
          <a href="home.html" class="logo-link">
            <img src="images/logo.png" alt="TRIPICK" class="logo">
          </a>
          <span class="txt">

          </span>
        </h1>

        <nav class="menu" aria-label="메인 메뉴"></nav>

    <div class="intro-box">
      <p class="intro-badge"><span class="intro-badge-spark" aria-hidden="true">✨</span> 취향 맞춤 여행지 추천</p>

      <p class="intro-sub">나에게 맞는 여행지를 찾아보세요</p>
      <a href="home.html" class="btn">나에게 맞는 여행지 찾기 <span class="arrow">→</span></a>
